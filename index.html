<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD 编辑器</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="toolbar">
      <button id="btn-open" type="button">📂 打开</button>
      <button id="btn-save" type="button">💾 保存</button>
      <span id="export-wrap">
        <button id="btn-export" type="button" title="导出（Ctrl+P 导出 PDF）">💾 导出 ▾</button>
        <div id="export-menu" hidden>
          <button data-export="pdf" type="button">📄 PDF（矢量）</button>
          <button data-export="html" type="button">🌐 HTML（带样式）</button>
          <button data-export="html-plain" type="button">📝 HTML（纯净）</button>
          <button data-export="image" type="button">🖼 图片 PNG（长图）</button>
          <button data-export="docx" type="button">📄 Word (.docx)</button>
          <button data-export="copy" type="button">📋 复制富文本</button>
          <div class="menu-sep"></div>
          <div class="menu-label" id="pandoc-label">Pandoc</div>
          <button data-export="epub" data-pandoc="1" type="button" disabled>📚 EPUB</button>
          <button data-export="latex" data-pandoc="1" type="button" disabled>∑ LaTeX</button>
          <button data-export="rtf" data-pandoc="1" type="button" disabled>📃 RTF</button>
        </div>
      </span>
      <button id="btn-focus-mode" type="button" title="专注模式（F8）：淡化非当前段落">🎯 专注</button>
      <button id="btn-find" type="button" title="查找替换（Ctrl+F / Ctrl+H）">🔍 查找</button>
      <button id="btn-mode" type="button" title="切回即时渲染模式（Ctrl+Alt+M）">切回即时渲染</button>
      <span id="mode-badge" class="mode-badge wysiwyg" title="当前：所见即所得模式（可直接编辑表格）">所见即所得</span>
      <input id="font-size-select" type="number" min="8" max="72" step="1" value="16" title="编辑区字号" style="width: 4em" />
      <select id="lang-select" title="Language / 语言">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
      </select>
      <span id="file-title">（未命名）</span>
      <span id="encoding-badge"></span>
      <span id="app-version" title="软件版本（报问题时先看这里）">v0.3.0</span>
    </div>
    <div id="tabs"></div>
    <div id="main">
      <aside id="outline-panel">
        <div class="panel-title" id="panel-title">大纲 · 点击定位 · ✕删除 · 拖动重排</div>
        <ul id="outline"></ul>
      </aside>
      <main id="editor-wrap">
        <div id="editor"></div>
        <div id="find-bar" hidden>
          <div class="find-row">
            <input id="find-input" type="text" placeholder="查找…" autocomplete="off" spellcheck="false" />
            <span id="find-count" class="find-count">0/0</span>
            <button id="find-prev" type="button" title="上一个（Shift+Enter）">↑</button>
            <button id="find-next" type="button" title="下一个（Enter）">↓</button>
            <button id="find-close" type="button" title="关闭（Esc）">✕</button>
          </div>
          <div class="find-row" id="replace-row" hidden>
            <input id="replace-input" type="text" placeholder="替换为…" autocomplete="off" spellcheck="false" />
            <button id="replace-one" type="button">替换</button>
            <button id="replace-all" type="button">全部替换</button>
          </div>
        </div>
        <div id="zoom-bar" title="显示比例：Ctrl+滚轮缩放，Ctrl+0 复位（50%~200%）">
          <button id="zoom-out" type="button" title="缩小">−</button>
          <input id="zoom-slider" type="range" min="50" max="200" step="10" value="100" title="拖动调整显示比例" />
          <button id="zoom-in" type="button" title="放大">+</button>
          <span id="zoom-badge">100%</span>
        </div>
        <div id="find-overlay"></div>
        <div id="empty-state" hidden><div class="empty-hint" id="empty-hint">📋 点击顶部「📂 打开」，或把 .md 文件拖入窗口，开始编辑</div></div>
      </main>
    </div>
    <div id="close-confirm" class="modal-mask" hidden>
      <div class="modal">
        <div class="modal-msg" id="cc-msg">有未保存的修改，是否保存？</div>
        <div class="modal-btns">
          <button id="cc-save" type="button">保存并关闭</button>
          <button id="cc-discard" type="button">不保存关闭</button>
          <button id="cc-cancel" type="button">取消</button>
        </div>
      </div>
    </div>
    <div id="export-overlay" class="modal-mask" hidden>
      <div class="modal export-modal">
        <div class="modal-msg" id="export-msg">正在导出 PDF，请稍候…</div>
        <div class="export-progress"><div class="export-progress-bar" id="export-progress-bar"></div></div>
        <div class="export-pct" id="export-pct">0%</div>
      </div>
    </div>
  </body>
</html>
