<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD 编辑器</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="toolbar">
      <button id="btn-open" type="button">📂 打开</button>
      <button id="btn-save" type="button">💾 保存</button>
      <button id="btn-mode" type="button" title="切回即时渲染模式（Ctrl+Alt+M）">切回即时渲染</button>
      <span id="mode-badge" class="mode-badge wysiwyg" title="当前：所见即所得模式（可直接编辑表格）">所见即所得</span>
      <span id="file-title">（未命名）</span>
      <span id="encoding-badge"></span>
    </div>
    <div id="tabs"></div>
    <div id="main">
      <aside id="outline-panel">
        <div class="panel-title">大纲 · 点击定位 · ✕删除 · 拖动重排</div>
        <ul id="outline"></ul>
      </aside>
      <main id="editor-wrap">
        <div id="editor"></div>
        <div id="empty-state" hidden><div class="empty-hint">📋 点击顶部「📂 打开」，或把 .md 文件拖入窗口，开始编辑</div></div>
      </main>
    </div>
    <div id="close-confirm" class="modal-mask" hidden>
      <div class="modal">
        <div class="modal-msg">有未保存的修改，是否保存？</div>
        <div class="modal-btns">
          <button id="cc-save" type="button">保存并关闭</button>
          <button id="cc-discard" type="button">不保存关闭</button>
          <button id="cc-cancel" type="button">取消</button>
        </div>
      </div>
    </div>
  </body>
</html>
